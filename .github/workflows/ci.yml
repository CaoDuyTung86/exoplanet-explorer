name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run tsc

      - name: Build
        run: pnpm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite covers the domain logic and the binary wire format, neither of which
      # touches the database, so no Postgres service is needed here.
      - name: Tests
        run: python -m pytest -q

      - name: Import check
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

  api-image:
    name: API image
    runs-on: ubuntu-latest
    needs: api

    steps:
      - uses: actions/checkout@v4

      # Proves the Dockerfile still builds. Pushing to a registry belongs with the
      # deploy work in Phase 4.
      - name: Build image
        run: docker build -t exoplanet-api:ci ./server
